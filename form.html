<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="node_modules/materialize-css/dist/css/materialize.min.css">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="node_modules/materialize-css/dist/js/materialize.min.js"></script>
  <title>Sacramental Registry</title>
  <style>
    label {
      margin-top: 4px;
    }
    .btn {
      width: 100px;
    }
    .col {
      margin: 0;
    }
    .col:first-child {
      padding-left: 0;
    }
    .col:last-child {
      padding-right: 0;
    }
    .col:first-child label {
      left: 0;
    }
    .helper-text {
      margin-bottom: 10px;
    }
    .row {
      margin-bottom: 0;
    }
    .tabs {
      margin-bottom: 1.2rem;
    }
    .volume-info {
      margin-bottom: 20px;
    }
    #actions {
      text-align: end;
    }
    #container {
      margin: auto;
      padding: 40px 0;
      width: 90%;
    }
    #delete-button {
      display: none;
      margin-right: 10px;
    }
    #modal-message {
      font-size: 1.5rem;
    }
    #submit-button {
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="form">
      <div class="row">
        <ul class="tabs tabs-fixed-width">
          <li class="tab col s2"><a class="active" href="#personal-info">Personal Info</a></li>
          <li class="tab col s2"><a href="#baptism">Baptism</a></li>
          <li class="tab col s2"><a href="#communion">Communion</a></li>
          <li class="tab col s2"><a href="#confirmation">Confirmation</a></li>
          <li class="tab col s2"><a href="#marriage">Marriage</a></li>
          <li class="tab col s2"><a href="#profession-of-faith">Profession of Faith</a></li>
          <li class="tab col s2"><a href="#death">Death</a></li>
        </ul>
      </div>
      <div id="personal-info">
        <div class="row">
          <div class="input-field col s6">
            <input type="text" name="first_name" id="first_name" class="validate" required>
            <label for="first_name">First Name</label>
            <span class="helper-text">Middle name can be included here</span>
          </div>
          <div class="input-field col s6">
            <input type="text" name="last_name" id="last_name" class="validate" required>
            <label for="last_name">Last Name</label>
          </div>
        </div>
        <div class="input-field">
          <select name="sex" id="sex" required>
            <option value="" selected disabled>Select</option>
            <option value="Female">Female</option>
            <option value="Male">Male</option>
          </select>
          <label for="sex">Sex</label>
        </div>
        <div class="input-field">
          <input type="date" name="birthdate" id="birthdate" class="validate" required>
          <label for="birthdate">Birthdate</label>
        </div>
        <div class="input-field">
          <input type="text" name="birth_city" id="birth_city" class="validate" required>
          <label for="birth_city">Birth City</label>
        </div>
        <div class="input-field">
          <input type="text" name="home_address_line_1" id="home_address_line_1" class="validate" required>
          <label for="home_address_line_1">Home Address Line 1</label>
        </div>
        <div class="input-field">
          <input type="text" name="home_address_line_2" id="home_address_line_2" class="validate">
          <label for="home_address_line_2">Home Address Line 2</label>
          <span class="helper-text">Apartment, suite, unit, building, floor, etc.</span>
        </div>
        <div class="row">
          <div class="input-field col s6">
            <input type="text" name="city" id="city" class="validate" required>
            <label for="city">City</label>
          </div>
          <div class="input-field col s3">
            <select name="region" id="region">
              <option value="AK">Alaska</option>
              <option value="AL">Alabama</option>
              <option value="AR">Arkansas</option>
              <option value="AZ">Arizona</option>
              <option value="CA" selected>California</option>
              <option value="CO">Colorado</option>
              <option value="CT">Connecticut</option>
              <option value="DE">Delaware</option>
              <option value="FL">Florida</option>
              <option value="GA">Georgia</option>
              <option value="HI">Hawaii</option>
              <option value="IA">Iowa</option>
              <option value="ID">Idaho</option>
              <option value="IL">Illinois</option>
              <option value="IN">Indiana</option>
              <option value="KS">Kansas</option>
              <option value="KY">Kentucky</option>
              <option value="LA">Louisiana</option>
              <option value="MA">Massachusetts</option>
              <option value="MD">Maryland</option>
              <option value="ME">Maine</option>
              <option value="MI">Michigan</option>
              <option value="MN">Minnesota</option>
              <option value="MO">Missouri</option>
              <option value="MS">Mississippi</option>
              <option value="MT">Montana</option>
              <option value="NC">North Carolina</option>
              <option value="ND">North Dakota</option>
              <option value="NE">Nebraska</option>
              <option value="NH">New Hampshire</option>
              <option value="NJ">New Jersey</option>
              <option value="NM">New Mexico</option>
              <option value="NV">Nevada</option>
              <option value="NY">New York</option>
              <option value="OH">Ohio</option>
              <option value="OK">Oklahoma</option>
              <option value="OR">Oregon</option>
              <option value="PA">Pennsylvania</option>
              <option value="RI">Rhode Island</option>
              <option value="SC">South Carolina</option>
              <option value="SD">South Dakota</option>
              <option value="TN">Tennessee</option>
              <option value="TX">Texas</option>
              <option value="UT">Utah</option>
              <option value="VA">Virginia</option>
              <option value="VT">Vermont</option>
              <option value="WA">Washington</option>
              <option value="WI">Wisconsin</option>
              <option value="WV">West Virginia</option>
              <option value="WY">Wyoming</option>
            </select>
            <label for="region">State</label>
          </div>
          <div class="input-field col s3">
            <input type="text" name="zip_code" id="zip_code" class="validate" pattern="^[0-9]{5}(?:-[0-9]{4})?$" required>
            <label for="zip_code">ZIP Code</label>
          </div>
        </div>
        <div class="input-field">
          <input type="text" name="father" id="father" class="validate">
          <label for="father">Father</label>
        </div>
        <div class="input-field">
          <input type="text" name="mother" id="mother" class="validate">
          <label for="mother">Mother</label>
        </div>
        <div class="input-field">
          <textarea name="comments" id="comments" class="materialize-textarea"></textarea>
          <label for="comments">Comments</label>
        </div>
      </div>
      <div id="baptism">
        <div class="input-field">
          <input type="date" name="baptism-date" id="baptism-date" class="validate">
          <label for="baptism-date">Baptism Date</label>
        </div>
        <div class="input-field">
          <input type="text" name="baptism-church" id="baptism-church" class="validate" value="Cathedral of Our Lady of the Angels">
          <label for="baptism-church">Baptism Church</label>
        </div>
        <div class="input-field">
          <input type="text" name="godfather" id="godfather" class="validate">
          <label for="godfather">Godfather</label>
        </div>
        <div class="input-field">
          <input type="text" name="proxy-godfather" id="proxy-godfather" class="validate">
          <label for="proxy-godfather">Proxy Godfather</label>
        </div>
        <div class="input-field">
          <input type="text" name="godmother" id="godmother" class="validate">
          <label for="godmother">Godmother</label>
        </div>
        <div class="input-field">
          <input type="text" name="proxy-godmother" id="proxy-godmother" class="validate">
          <label for="proxy-godmother">Proxy Godmother</label>
        </div>
        <div class="input-field">
          <input type="text" name="presider" id="presider" class="validate">
          <label for="presider">Presider</label>
        </div>
        <div class="row volume-info">
          <div class="input-field col s4">
            <input type="text" name="baptism-volume" id="baptism-volume" class="validate">
            <label for="baptism-volume">Volume</label>
          </div>
          <div class="input-field col s4">
            <input type="text" name="baptism-section" id="baptism-section" class="validate">
            <label for="baptism-section">Section</label>
          </div>
          <div class="input-field col s4">
            <input type="text" name="baptism-line" id="baptism-line" class="validate">
            <label for="baptism-line">Line</label>
          </div>
        </div>
      </div>
      <div id="communion">
        <div class="input-field">
          <input type="date" name="communion-date" id="communion-date" class="validate">
          <label for="communion-date">First Communion Date</label>
        </div>
        <div class="input-field">
          <input type="text" name="communion-church" id="communion-church" class="validate" value="Cathedral of Our Lady of the Angels">
          <label for="communion-church">First Communion Church</label>
        </div>
        <div class="input-field">
          <input type="text" name="communion-presider" id="communion-presider" class="validate">
          <label for="communion-presider">Presider</label>
        </div>
        <div class="row volume-info">
          <div class="input-field col s4">
            <input type="text" name="communion-volume" id="communion-volume" class="validate">
            <label for="communion-volume">Volume</label>
          </div>
          <div class="input-field col s4">
            <input type="text" name="communion-section" id="communion-section" class="validate">
            <label for="communion-section">Section</label>
          </div>
          <div class="input-field col s4">
            <input type="text" name="communion-line" id="communion-line" class="validate">
            <label for="communion-line">Line</label>
          </div>
        </div>
      </div>
      <div id="confirmation">Confirmation</div>
      <div id="marriage">Marriage</div>
      <div id="profession-of-faith">Profession of Faith</div>
      <div id="death">Death</div>
      <div id="actions">
        <button id="submit-button" class="waves-effect waves-light btn">Submit</button>
        <button id="delete-button" href="#warning" class="waves-effect waves-light btn red modal-trigger">Delete</button>
        <a href="index.html" class="waves-effect waves-grey btn grey lighten-3 black-text">Cancel</a>
      </div>
    </div>
  </div>
  <div id="warning" class="modal">
    <div class="modal-content">
      <p id="modal-message"></p>
    </div>
    <div class="modal-footer">
      <button id="confirm-deletion-button" class="waves-effect waves-light btn-flat red-text">Delete</button>
      <button class="modal-close waves-effect waves-ligth btn-flat">Cancel</button>
    </div>
  </div>
  <script src="form.js"></script>
</body>
</html>
