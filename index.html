<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="node_modules/materialize-css/dist/css/materialize.min.css">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="node_modules/materialize-css/dist/js/materialize.min.js"></script>
  <title>Sacramental Registry</title>
  <style>
    body, html {
      height: 100%;
    }
    .btn-floating {
      position: absolute;
      bottom: 2rem;
      right: 2rem;
    }
    .result {
      margin-bottom: 10px;
      width: 100%;
      padding: 10px;
    }
    .result p {
      margin: 0;
    }
    .result:hover {
      background: #f6685e;
      color: #fff;
      cursor: pointer;
    }
    .result-name {
      font-size: 1.2rem;
    }
    .result-address {
      font-size: 1rem;
    }
    .result-father, .result-mother {
      font-size: 0.8rem;
    }
    #container {
      align-items: center;
      display: flex;
      height: 100%;
      justify-content: center;
      width: 100%;
    }
    #results {
      height: 0;
      opacity: 0;
      overflow: auto hidden;
      transition: all 0.4s ease-in;
    }
    #results.show-results {
      height: 300px;
      opacity: 1;
    }
    #search-box {
      min-height: 300px;
      min-width: 560px;
      width: 50%;
    }
  </style>
</head>
<body>
  <div id="container">
    <div id="search-box">
      <h1>Sacramental Registry</h1>
      <div class="input-field">
        <input type="text" name="search" id="search">
        <label for="search">Search</label>
      </div>
      <div id="results">
        <div class="result">
          <p class="result-name">First and last names</p>
          <p class="result-address">123 Example St. City, Region 98765</p>
          <p class="result-father">Father: -</p>
          <p class="result-mother">Mother: -</p>
        </div>
      </div>
    </div>
  </div>
  <a class="btn-floating btn-large waves-effect waves-light red" href="form.html">
    <i class="material-icons">add</i>
  </a>
  <script src="index.js"></script>
</body>
</html>
