<!DOCTYPE html>
<html lang="en">
<head>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link rel="stylesheet" href="node_modules/materialize-css/dist/css/materialize.min.css">
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="node_modules/materialize-css/dist/js/materialize.min.js"></script>
  <title>Sacramental Registry</title>
  <style>
    body, html {
      height: 100%;
    }
    td, th {
      padding: 10px;
      white-space: nowrap;
    }
    .person:hover {
      background: #e5e5e5;
      cursor: pointer;
    }
    #container {
      display: flex;
      flex-direction: column;
      height: 100%;
      margin: auto;
      width: 90%;
    }
    #header {
      font-size: 2.92rem;
    }
    #table-wrapper {
      flex: 1;
      overflow: auto;
    }
  </style>
</head>
<body>
  <div id="container">
    <h1 id="header">Sacramental Registry</h1>
    <div class="input-field">
      <input type="text" name="query" id="query" class="validate">
      <label for="query">Search</label>
    </div>
    <div id="table-wrapper">
      <table>
        <thead>
          <tr>
            <th>First Name</th>
            <th>Last Name</th>
            <th>Sex</th>
            <th>Birthdate</th>
            <th>Birth City</th>
            <th>Home Address</th>
            <th>City</th>
            <th>State</th>
            <th>ZIP Code</th>
            <th>Father</th>
            <th>Mother</th>
            <th>Baptism</th>
            <th>Communion</th>
            <th>Confirmation</th>
            <th>Wedding</th>
            <th>Profession</th>
            <th>Death</th>
          </tr>
        </thead>
        <tbody>
          <tr id="1" class="person">
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
          </tr>
          <tr id="2" class="person">
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
            <td>-</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  <div class="fixed-action-btn">
    <a class="btn-floating btn-large red modal-trigger" href="new-entry.html">
      <i class="large material-icons">add</i>
    </a>
  </div>
</body>
</html>
