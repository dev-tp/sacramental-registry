<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="node_modules/bootswatch/dist/cosmo/bootstrap.min.css">
  <link rel="stylesheet" href="node_modules/font-awesome/css/font-awesome.min.css">
  <link rel="stylesheet" href="index.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="database.js"></script>
  <title>Sacramental Registry</title>
</head>
<body>
  <nav>
    <div id="nav-content">
      <div class="nav-item">
        <i class="fa fa-search"></i>
      </div>
      <div class="nav-item">
        <i class="fa fa-bar-chart"></i>
      </div>
    </div>
    <div id="nav-footer">
      <div class="nav-item">
        <i class="fa fa-cog"></i>
      </div>
    </div>
  </nav>
  <main></main>
  <script>
    const components = {};

    async function loadComponent(url) {
      const response = await fetch(url);
      const text = await response.text();

      return new DOMParser().parseFromString(text, 'text/html').head.querySelector('template');
    }

    function registerComponent(template) {
      const component = document.importNode(template.content, true);
      components[template.dataset.id] = component;
      document.querySelector('main').append(component);
    }

    loadComponent('components/search-form.html').then(registerComponent);
  </script>
</body>
</html>
