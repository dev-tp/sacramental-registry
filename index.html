<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="stylesheet" href="node_modules/bootswatch/dist/cosmo/bootstrap.min.css">
  <link rel="stylesheet" href="node_modules/material-icons/iconfont/material-icons.css">
  <link rel="stylesheet" href="index.css">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script src="database.js"></script>
  <title>Sacramental Registry</title>
</head>
<body>
  <nav>
    <div id="nav-content">
      <div class="nav-item">
        <span class="material-icons">search</span>
      </div>
      <div class="nav-item">
        <span class="material-icons">bar_chart</span>
      </div>
    </div>
    <div id="nav-footer">
      <div class="nav-item">
        <span class="material-icons">settings</span>
      </div>
    </div>
  </nav>
  <main></main>
  <script>
    window.$ = require('jquery');
    window.Bootstrap = require('bootstrap');

    async function loadComponent(url, id) {
      const response = await fetch(url);
      const text = await response.text();
      const template = new DOMParser().parseFromString(text, 'text/html').head.querySelector('template');

      document.querySelector(id ? `#${id}` : 'main').append(document.importNode(template.content, true));
    }

    function switchSection(sectionId) {
      document.querySelector('.active-section').classList.remove('active-section');
      document.getElementById(sectionId).classList.add('active-section');
    }

    loadComponent('components/search-form.html');
    loadComponent('components/form/index.html');
    loadComponent('components/certificate.html');
    loadComponent('components/confirmation-modal.html');
    loadComponent('components/list-certificates-modal.html');
  </script>
</body>
</html>
